name: Build Everything

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number'
        required: true
        default: '001'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle --version
      
      - name: Create project structure
        run: |
          echo "🏗️ Creating project structure..."
          
          # Root files
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolution {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LinkDeck"
          include(":app")
          include(":core-design")
          include(":core-network")
          EOF
          
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF
          
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          
          cat > .gitignore << 'EOF'
          *.iml
          .gradle
          /local.properties
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          EOF
          
          echo "✅ Root files created"
      
      - name: Create core-design module
        run: |
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/theme
          mkdir -p core-design/src/main/java/com/linkdeck/core/design/components
          mkdir -p core-design/src/main/res/values
          
          cat > core-design/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.linkdeck.core.design"
              compileSdk = 34
              defaultConfig {
                  minSdk = 26
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
              implementation("androidx.compose.ui:ui-tooling-preview:1.5.4")
              implementation("androidx.compose.animation:animation:1.5.4")
          }
          EOF
          
          cat > core-design/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest />
          EOF
          
          echo "✅ core-design module created"
      
      - name: Create DesignTokens.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/DesignTokens.kt << 'EOF'
          package com.linkdeck.core.design

          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          object DesignTokens {
              val DarkBackground = Color(0xFF0E0B1F)
              val DarkSurface = Color(0xFF1A1633)
              val DarkRail = Color(0xFF141026)
              val DarkBorder = Color(0xFF2B2650)
              val DarkTile = Color(0xFF2A2455)
              val DarkTileIcon = Color(0xFFC9C2FF)
              val LightBackground = Color(0xFFF8F7F3)
              val LightSurface = Color(0xFFEFEDE6)
              val LightBorder = Color(0xFFD8D6CC)
              val LightTile = Color(0xFFE4E0F7)
              val LightTileIcon = Color(0xFF4A3FB8)
              val Primary = Color(0xFF5B4BD6)
              val MiddleRingColor = Color(0xFF4A4290)
              val DangerBg = Color(0xFF3A1212)
              val DangerText = Color(0xFFF87171)
              val LinkColor = Color(0xFFB9AFFF)
              val TextPrimaryDark = Color(0xFFEDEBFF)
              val TextSecondaryDark = Color(0xFFA9A4CF)
              val TextPrimaryLight = Color(0xFF1B1C1A)
              val TextSecondaryLight = Color(0xFF44463F)
              val SuccessBg = Color(0xFF12322E)
              val SuccessText = Color(0xFF5EEAD4)
              val WarningBg = Color(0xFF3A2A10)
              val WarningText = Color(0xFFFBBF24)
              val TitleFontSize = 26.sp
              val SectionTitleFontSize = 20.sp
              val ItemNameFontSize = 15.sp
              val BodyFontSize = 13.sp
              val ChipFontSize = 12.sp
              val LabelFontSize = 11.sp
              val CardRadius = 24.dp
              val TileRadius = 15.dp
              val TileSize = 44.dp
              val ButtonHeight = 48.dp
              val ScreenPadding = 22.dp
              val CardPadding = 16.dp
              val GapBetweenCards = 14.dp
          }
          EOF
          echo "✅ DesignTokens.kt created"
      
      - name: Create Theme.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/theme/Theme.kt << 'EOF'
          package com.linkdeck.core.design.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.material3.Typography
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          import com.linkdeck.core.design.DesignTokens

          private val DarkColorScheme = darkColorScheme(
              background = DesignTokens.DarkBackground,
              surface = DesignTokens.DarkSurface,
              surfaceVariant = DesignTokens.DarkRail,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryDark,
              onSurface = DesignTokens.TextPrimaryDark,
              onSurfaceVariant = DesignTokens.TextSecondaryDark,
              outline = DesignTokens.DarkBorder
          )

          private val LightColorScheme = lightColorScheme(
              background = DesignTokens.LightBackground,
              surface = DesignTokens.LightSurface,
              surfaceVariant = DesignTokens.LightSurface,
              primary = DesignTokens.Primary,
              onPrimary = Color.White,
              onBackground = DesignTokens.TextPrimaryLight,
              onSurface = DesignTokens.TextPrimaryLight,
              onSurfaceVariant = DesignTokens.TextSecondaryLight,
              outline = DesignTokens.LightBorder
          )

          val DefaultTypography = Typography(
              headlineLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 26.sp, lineHeight = 32.sp),
              headlineMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 20.sp, lineHeight = 26.sp),
              titleLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Bold, fontSize = 18.sp, lineHeight = 24.sp),
              titleMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 15.sp, lineHeight = 22.sp),
              bodyLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 15.sp, lineHeight = 22.sp),
              bodyMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Normal, fontSize = 13.sp, lineHeight = 20.sp),
              bodySmall = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Light, fontSize = 12.sp, lineHeight = 18.sp),
              labelLarge = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 13.sp, lineHeight = 18.sp),
              labelMedium = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp),
              labelSmall = TextStyle(fontFamily = FontFamily.Default, fontWeight = FontWeight.Medium, fontSize = 11.sp, lineHeight = 14.sp)
          )

          @Composable
          fun LinkDeckTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColorScheme else LightColorScheme
              MaterialTheme(
                  colorScheme = colorScheme,
                  typography = DefaultTypography,
                  content = content
              )
          }
          EOF
          echo "✅ Theme.kt created"
      
      - name: Create Components.kt
        run: |
          cat > core-design/src/main/java/com/linkdeck/core/design/components/Components.kt << 'EOF'
          package com.linkdeck.core.design.components

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import com.linkdeck.core.design.DesignTokens

          @Composable
          fun LinkDeckCard(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth().border(1.dp, MaterialTheme.colorScheme.outline, RoundedCornerShape(DesignTokens.CardRadius)),
                  shape = RoundedCornerShape(DesignTokens.CardRadius),
                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                  elevation = CardDefaults.cardElevation(defaultElevation = 0.dp)
              ) {
                  Column(modifier = Modifier.padding(DesignTokens.CardPadding.dp), content = content)
              }
          }

          @Composable
          fun IconTile(icon: ImageVector, modifier: Modifier = Modifier, tint: Color = MaterialTheme.colorScheme.primary, backgroundColor: Color = MaterialTheme.colorScheme.surfaceVariant, size: Int = 44, contentDescription: String? = null) {
              Box(modifier = modifier.size(size.dp).clip(RoundedCornerShape(DesignTokens.TileRadius)).background(backgroundColor), contentAlignment = Alignment.Center) {
                  Icon(imageVector = icon, contentDescription = contentDescription, tint = tint, modifier = Modifier.size(22.dp))
              }
          }

          enum class ChipVariant { Success, Warning, Danger }

          @Composable
          fun StatusChip(text: String, variant: ChipVariant, modifier: Modifier = Modifier) {
              val (bg, textColor) = when (variant) {
                  ChipVariant.Success -> DesignTokens.SuccessBg to DesignTokens.SuccessText
                  ChipVariant.Warning -> DesignTokens.WarningBg to DesignTokens.WarningText
                  ChipVariant.Danger -> DesignTokens.DangerBg to DesignTokens.DangerText
              }
              Surface(modifier = modifier, shape = RoundedCornerShape(50), color = bg) {
                  Text(text = text, modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp), style = MaterialTheme.typography.labelMedium, color = textColor)
              }
          }

          enum class ButtonVariant { Primary, Outlined }

          @Composable
          fun PillButton(text: String, onClick: () -> Unit, modifier: Modifier = Modifier, variant: ButtonVariant = ButtonVariant.Primary, enabled: Boolean = true) {
              when (variant) {
                  ButtonVariant.Primary -> {
                      Button(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary, contentColor = Color.White)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
                  ButtonVariant.Outlined -> {
                      OutlinedButton(onClick = onClick, modifier = modifier.fillMaxWidth().height(DesignTokens.ButtonHeight), enabled = enabled, shape = RoundedCornerShape(50), colors = ButtonDefaults.outlinedButtonColors(contentColor = MaterialTheme.colorScheme.onBackground)) {
                          Text(text, style = MaterialTheme.typography.titleMedium)
                      }
                  }
              }
          }
          EOF
          echo "✅ Components.kt created"
      
      - name: Create core-network module
        run: |
          mkdir -p core-network/src/main/java/com/linkdeck/core/network
          mkdir -p core-network/src/main/res/values
          
          cat > core-network/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
              id("kotlinx-serialization")
          }
          android {
              namespace = "com.linkdeck.core.network"
              compileSdk = 34
              defaultConfig {
                  minSdk = 26
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0")
          }
          EOF
          
          cat > core-network/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest />
          EOF
          
          cat > core-network/src/main/java/com/linkdeck/core/network/Placeholder.kt << 'EOF'
          package com.linkdeck.core.network
          // Placeholder - will be populated in Phase 2
          object NetworkPlaceholder
          EOF
          
          echo "✅ core-network module created"
      
      - name: Create app module
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-ar
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.linkdeck.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.linkdeck.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation(project(":core-design"))
              implementation(project(":core-network"))
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.1")
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
              implementation("androidx.compose.material:material-icons-extended:1.5.4")
              implementation("androidx.compose.ui:ui-tooling-preview:1.5.4")
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          echo "✅ app module created"
      
      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/linkdeck/app/MainActivity.kt << 'EOF'
          package com.linkdeck.app

          import android.os.Bundle
          androidx.activity.ComponentActivity
          androidx.activity.compose.setContent
          androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Devices
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import com.linkdeck.core.design.DesignTokens
          import com.linkdeck.core.design.components.*
          import com.linkdeck.core.design.theme.LinkDeckTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      LinkDeckTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              WelcomeScreen()
                          }
                      }
                  }
              }
          }

          @Composable
          fun WelcomeScreen() {
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(MaterialTheme.colorScheme.background),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(DesignTokens.ScreenPadding.dp),
                      verticalArrangement = Arrangement.spacedBy(16.dp)
                  ) {
                      IconTile(
                          icon = Icons.Filled.Devices,
                          size = 80,
                          backgroundColor = MaterialTheme.colorScheme.primary,
                          tint = Color.White
                      )
                      Text(
                          text = stringResource(R.string.app_name),
                          style = MaterialTheme.typography.headlineLarge,
                          color = MaterialTheme.colorScheme.onBackground
                      )
                      Text(
                          text = stringResource(R.string.welcome_message),
                          style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(24.dp))
                      PillButton(
                          text = stringResource(R.string.get_started),
                          onClick = { },
                          variant = ButtonVariant.Primary
                      )
                      PillButton(
                          text = stringResource(R.string.about_app),
                          onClick = { },
                          variant = ButtonVariant.Outlined
                      )
                      Spacer(Modifier.height(32.dp))
                      Text(
                          text = stringResource(R.string.built_with_bfb),
                          style = MaterialTheme.typography.labelSmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.6f)
                      )
                  }
              }
          }
          EOF
          echo "✅ MainActivity.kt created"
      
      - name: Create strings.xml (English)
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">LinkDeck</string>
              <string name="welcome_message">Universal "Super Device" alternative: one APK, two modes — HOST (phone) and CONTROLLER (tablet). 100% offline over local Wi-Fi.</string>
              <string name="get_started">Get Started</string>
              <string name="about_app">About</string>
              <string name="built_with_bfb">Built with BFB.AI · Built For Benefits, by AI</string>
              <string name="copy_error">Copy error</string>
          </resources>
          EOF
          echo "✅ English strings created"
      
      - name: Create strings.xml (Arabic)
        run: |
          cat > app/src/main/res/values-ar/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">LinkDeck</string>
              <string name="welcome_message">بديل شامل لـ "الجهاز الفائق": تطبيق واحد، وضعان — المضيف (الهاتف) والمتحكم (التابلت). يعمل 100% بدون إنترنت عبر Wi-Fi محلي.</string>
              <string name="get_started">ابدأ الآن</string>
              <string name="about_app">عن التطبيق</string>
              <string name="built_with_bfb">بُني بـ BFB.AI · صُنع لأجل المنفعة، بواسطة الذكاء الاصطناعي</string>
              <string name="copy_error">نسخ الخطأ</string>
          </resources>
          EOF
          echo "✅ Arabic strings created"
      
      - name: Create placeholder drawable
        run: |
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#5B4BD6"
                  android:pathData="M54,54m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0"/>
          </vector>
          EOF
          echo "✅ Drawable created"
      
      - name: Create documentation files
        run: |
          cat > README.md << 'EOF'
          # LinkDeck
          
          **BFB.AI · Built For Benefits, by AI**
          
          Universal "Super Device" alternative: one APK, two modes — **HOST** (phone) and **CONTROLLER** (tablet).
          
          ## Features
          - 🔌 Two modes in one APK
          - 📡 100% Offline (local Wi-Fi)
          - 🔒 Secure (TLS + certificate pinning)
          - 📱 QR pairing
          - 🌍 Bilingual (Arabic RTL + English LTR)
          - 🎨 Modern UI (Material 3)
          
          ## Build
          ```bash
          ./gradlew :app:assembleDebug
          ```
          
          **Built with BFB.AI — Built For Benefits, by AI**
          EOF
          
          cat > BFB.txt << 'EOF'
          ═══════════════════════════════════════════════════════════════════
          BFB.AI
          Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          
          Name:    LinkDeck
          Version: 1.0.0
          Build:   #001
          Date:    2026-11-07
          
          Google Services Mode: A (Open - No GMS)
          Languages: Arabic (RTL) + English (LTR)
          
          ═══════════════════════════════════════════════════════════════════
          Built with BFB.AI — Built For Benefits, by AI
          ═══════════════════════════════════════════════════════════════════
          EOF
          
          echo "✅ Documentation created"
      
      - name: Build app
        run: |
          echo "🔨 Building app..."
          gradle :app:assembleDebug --stacktrace
          echo "✅ Build successful!"
      
      - name: Set version variables
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build_number }}"
          DATE=$(date +%Y%m%d)
          ZIP_NAME="LinkDeck_v${VERSION}_build${BUILD}_${DATE}.zip"
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK path: $APK_PATH"
      
      - name: Create ZIP package
        run: |
          ZIP_NAME="${{ steps.vars.outputs.zip_name }}"
          APK_PATH="${{ steps.vars.outputs.apk_path }}"
          
          if [ ! -f "$APK_PATH" ]; then
              echo "❌ APK not found!"
              exit 1
          fi
          
          mkdir -p LinkDeck_Release
          cp "$APK_PATH" LinkDeck_Release/LinkDeck.apk
          cp BFB.txt LinkDeck_Release/
          cp README.md LinkDeck_Release/
          
          cd LinkDeck_Release
          zip -r "../$ZIP_NAME" .
          cd ..
          
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          echo "✅ Created: $ZIP_NAME"
          ls -lh "$ZIP_NAME"
      
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip_name }}
          path: |
            ${{ steps.vars.outputs.zip_name }}
            ${{ steps.vars.outputs.zip_name }}.sha256
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.vars.outputs.version }}-build${{ steps.vars.outputs.build }}
          name: "LinkDeck v${{ steps.vars.outputs.version }} (Build #${{ steps.vars.outputs.build }})"
          body: |
            ## 🎉 LinkDeck v${{ steps.vars.outputs.version }}
            
            **Built with BFB.AI — Built For Benefits, by AI**
            
            ### 📦 What's Included
            - ✅ LinkDeck APK
            - ✅ BFB.txt
            - ✅ README.md
            - ✅ SHA256 checksum
            
            ### 📋 SHA256
            ```
