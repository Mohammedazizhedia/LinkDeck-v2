name: Build LinkDeck

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install Gradle
        run: sudo apt-get install -y gradle
      
      - name: Delete old settings if exists
        run: rm -f settings.gradle settings.gradle.kts
      
      - name: Create settings.gradle.kts
        run: |
          cat > settings.gradle.kts << 'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LinkDeck-v2"
          include(":app")
          SETTINGS
          echo "✅ settings.gradle.kts created"
          cat settings.gradle.kts
      
      - name: Create root build.gradle.kts
        run: |
          cat > build.gradle.kts << 'ROOT'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          ROOT
          echo "✅ root build.gradle.kts created"
      
      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          PROPS
      
      - name: Create app module structure
        run: |
          mkdir -p app/src/main/java/com/linkdeck/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
      
      - name: Create app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'APP'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.linkdeck.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.linkdeck.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.1")
              implementation("androidx.compose.ui:ui:1.5.4")
              implementation("androidx.compose.material3:material3:1.1.2")
              implementation("androidx.compose.material:material-icons-extended:1.5.4")
              implementation("androidx.compose.ui:ui-tooling-preview:1.5.4")
          }
          APP
          echo "✅ app/build.gradle.kts created"
      
      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="LinkDeck"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
      
      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/linkdeck/app/MainActivity.kt << 'MAIN'
          package com.linkdeck.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              Box(contentAlignment = Alignment.Center) {
                                  Text("LinkDeck v1.0.0 - Build Successful!", style = MaterialTheme.typography.headlineMedium)
                              }
                          }
                      }
                  }
              }
          }
          MAIN
      
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">LinkDeck</string>
          </resources>
          STRINGS
      
      - name: Verify structure
        run: |
          echo "📂 Project structure:"
          find . -type f \( -name "*.gradle.kts" -o -name "*.xml" -o -name "*.kt" \) | grep -v ".gradle/" | sort
          echo ""
          echo "📋 settings.gradle.kts:"
          cat settings.gradle.kts
          echo ""
          echo "🔍 Gradle projects:"
          gradle projects
      
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkDeck-APK
          path: app/build/outputs/apk/debug/app-debug.apk
