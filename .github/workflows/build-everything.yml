name: Build Everything

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0'
      build_number:
        description: 'Build number'
        required: true
        default: '001'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Debug - Show current directory
        run: |
          echo "📍 Current directory:"
          pwd
          echo ""
          echo "📂 Files in current directory:"
         
